<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 学生会内容管理后台</title>
<link rel="stylesheet" href="assets/admin.css?v=15">
</head>
<body class="admin-login-body">

<div class="login-wrap">
   <div class="login-card">
       <div class="login-brand">
           <div class="login-logo">
               <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                   <path d="M20 4L8 10V22C8 28.63 12.87 34.47 20 36C27.13 34.47 32 28.63 32 22V10L20 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                   <path d="M15 20L18.5 23.5L26 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
               </svg>
           </div>
           <h1>药品与环境工程学院学生会</h1>
           <p class="login-sub">内容管理系统 · Content Management System</p>
       </div>

       <form class="login-form" id="loginForm" autocomplete="off">
           <div class="form-group">
               <label for="username">账号</label>
               <input type="text" id="username" name="username" placeholder="请输入管理员账号" required autofocus>
           </div>
           <div class="form-group">
               <label for="password">密码</label>
               <input type="password" id="password" name="password" placeholder="请输入密码" required>
           </div>

           <div class="login-error" id="loginError" style="display:none;"></div>

           <button type="submit" class="btn btn-primary btn-block btn-lg">登 录</button>

           <div class="login-tip">
               <strong>默认账号：</strong>admin &nbsp; <strong>默认密码：</strong>admin123
               <br>
               登录后请在「账号设置」中修改密码。
           </div>
       </form>

       <div class="login-footer">
           <a href="../index.html" target="_blank">← 返回站点首页</a>
       </div>
   </div>
</div>

<script src="assets/data-defaults.js?v=15"></script>
<script src="../assets/supabase-config.js?v=15"></script>
<script src="assets/admin-common.js?v=15"></script>
<script>
/* 登录页自定义 Logo 渲染 */
(function applyLoginLogo(){
  var fromLs = null;
  try { fromLs = JSON.parse(localStorage.getItem('CMS') || 'null'); } catch(e) {}
  var def = window.CMS_DEFAULTS || {};
  var cms = fromLs && fromLs.site ? fromLs : def;
  var logoUrl = cms.site && cms.site.logoUrl ? String(cms.site.logoUrl).trim() : '';
  var logoAlt = (cms.site && cms.site.logoAlt) ? String(cms.site.logoAlt) : 'Logo';
  var brandTitle = (cms.site && cms.site.logoTitle) ? String(cms.site.logoTitle) : '药品与环境工程学院学生会';
  var logoBox = document.querySelector('.login-logo');
  if (logoBox && logoUrl) {
    var img = document.createElement('img');
    img.src = logoUrl; img.alt = logoAlt;
    img.style.cssText = 'width:48px;height:48px;object-fit:contain;border-radius:12px;';
    logoBox.innerHTML = ''; logoBox.appendChild(img);
  }
  var h1 = document.querySelector('.login-brand h1');
  if (h1 && brandTitle) h1.textContent = brandTitle;
})();
</script>
</body>
</html>
