<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容管理后台 · 药品与环境工程学院学生会</title>
<meta http-equiv="refresh" content="0;url=dashboard.html">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#f4f6fb;color:#333;display:flex;align-items:center;justify-content:center;height:100vh;}
.box{background:#fff;padding:32px 40px;border-radius:12px;box-shadow:0 10px 30px rgba(11,61,145,.08);text-align:center;max-width:360px;}
h1{margin:0 0 8px;color:#0B3D91;font-size:18px;font-weight:600;}
p{margin:0;color:#6a718b;font-size:14px;line-height:1.8;}
a{color:#0B3D91;text-decoration:none;font-weight:500;}
a:hover{text-decoration:underline;}
.spinner{width:28px;height:28px;border:3px solid #e3e6ee;border-top-color:#0B3D91;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="box">
<div class="spinner" aria-hidden="true"></div>
<h1>正在进入后台…</h1>
<p>若浏览器未自动跳转，<br>请点击 <a href="dashboard.html">仪表盘</a> 继续。</p>
</div>
<script>
(function () {
    try {
        // 兼容旧 hash 书签：如 admin/index.html#news → 跳 news.html
        var h = (location.hash || '').replace(/^#/, '').split('/')[0];
        var allowed = ['dashboard','slides','stats','about','structure','news','showcase','shortcuts','contact','site','account'];
        var target = (h && allowed.indexOf(h) >= 0) ? (h + '.html') : 'dashboard.html';
        location.replace(target);
    } catch (e) {
        location.replace('dashboard.html');
    }
})();
</script>
</body>
</html>
