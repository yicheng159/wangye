<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#0B3D91;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;}
.box{text-align:center;padding:32px 40px;}
h1{margin:0 0 12px;font-size:20px;font-weight:600;}
p{margin:0 0 20px;opacity:.85;font-size:14px;line-height:1.8;}
a{color:#D4A853;text-decoration:none;font-weight:500;}
a:hover{text-decoration:underline;}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;margin:0 auto 20px;animation:s .8s linear infinite;}
@keyframes s{to{transform:rotate(360deg);}}

<div class="spinner" aria-hidden="true"></div>

<script>location.replace("admin/slides.html" + location.search + location.hash);</script>
